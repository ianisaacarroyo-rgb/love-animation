<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aventura Pixel RPG Top-Down</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', Courier, monospace;
      color: white;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      border: 4px solid #333;
      border-radius: 8px;
      overflow: hidden;
      background-color: #4a8c3d;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 12;
    }

    .stat-box {
      background: rgba(0, 0, 0, 0.75);
      padding: 8px 12px;
      border-radius: 6px;
      border: 2px solid #555;
      font-weight: bold;
      font-size: 14px;
    }

    .bar-container {
      width: 120px;
      height: 12px;
      background: #333;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
      border: 1px solid #000;
    }

    .bar-fill-hp {
      height: 100%;
      background: #e74c3c;
      width: 100%;
      transition: width 0.2s;
    }

    .bar-fill-mana {
      height: 100%;
      background: #3498db;
      width: 100%;
      transition: width 0.2s;
    }

    .bar-fill-xp {
      height: 100%;
      background: #f1c40f;
      width: 0%;
      transition: width 0.2s;
    }

    #controls-hint {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      border: 1px solid #555;
      pointer-events: none;
      white-space: nowrap;
      z-index: 10;
    }

    #shop-panel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(17, 17, 17, 0.96);
      border: 3px solid #f1c40f;
      border-radius: 12px;
      padding: 18px;
      width: min(420px, 80%);
      z-index: 20;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
    }

    #shop-panel.hidden {
      display: none;
    }

    .shop-title {
      text-align: center;
      font-size: 24px;
      margin-bottom: 16px;
      color: #f1c40f;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(140px, 1fr));
      gap: 12px;
    }

    .shop-item {
      background: #222;
      border: 2px solid #444;
      border-radius: 8px;
      padding: 10px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .shop-item:hover {
      transform: translateY(-2px);
      border-color: #f1c40f;
    }

    .shop-buttons {
      margin-top: 18px;
      display: flex;
      justify-content: center;
    }

    #close-shop {
      background: #444;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay .card {
      background: rgba(16, 28, 40, 0.95);
      border: 3px solid #f1c40f;
      border-radius: 16px;
      padding: 24px 30px;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0,0,0,0.4);
    }

    .overlay h1 {
      margin-bottom: 12px;
      color: #f1c40f;
      font-size: 28px;
    }

    .overlay p {
      line-height: 1.5;
      margin-bottom: 18px;
      color: #ecf0f1;
    }

    #start-btn {
      padding: 12px 20px;
      background: linear-gradient(#f1c40f, #d68910);
      border: none;
      border-radius: 10px;
      color: #111;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="hud">
      <div class="stat-box">
        <div>JUGADOR <span id="level-txt">Nv. 1</span></div>
        <div class="bar-container">
          <div id="hp-bar" class="bar-fill-hp"></div>
        </div>
        <div class="bar-container" style="margin-top: 4px;">
          <div id="mana-bar" class="bar-fill-mana"></div>
        </div>
        <div class="bar-container" style="margin-top: 4px;">
          <div id="xp-bar" class="bar-fill-xp"></div>
        </div>
      </div>
      <div class="stat-box" style="text-align: right;">
        <div><span id="zone-name">BOSQUE DEL PUEBLO</span> <span id="zone-txt">· ZONA 1/5</span></div>
        <div style="color: #f1c40f; margin-top: 4px;">KILLS: <span id="kills-txt">0</span></div>
        <div id="gold-txt" style="color: #f1c40f; margin-top: 4px;">ORO: 0</div>
        <div id="mission-txt" style="color: #ecf0f1; margin-top: 6px; font-size: 12px;">MISIÓN: Mata 5 enemigos</div>
      </div>
    </div>

    <div id="controls-hint">
      [W, A, S, D] Moverse | [ESPACIO] Atacar | [K] Magia | [E] Tienda
    </div>

    <div id="shop-panel" class="hidden">
      <div class="shop-title">Tienda del Pueblo</div>
      <div class="shop-grid">
        <button class="shop-item" id="buy-potion">Poción (+30 HP) - 25 oro</button>
        <button class="shop-item" id="buy-mana">Mana (+35) - 20 oro</button>
        <button class="shop-item" id="buy-sword">Espada +10 daño - 60 oro</button>
        <button class="shop-item" id="buy-armor">Armadura +25 HP - 80 oro</button>
      </div>
      <div class="shop-buttons">
        <button id="close-shop">Cerrar</button>
      </div>
    </div>

    <div id="overlay" class="overlay">
      <div class="card">
        <h1 id="overlay-title">Bosque del Pueblo</h1>
        <p id="overlay-text">Mata enemigos, mejora tu equipo y derrota al jefe del bosque.</p>
        <button id="start-btn">Empezar</button>
      </div>
    </div>

    <canvas id="gameCanvas" width="800" height="576"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const TILE_SIZE = 32;
    const MAP_COLS = 40;
    const MAP_ROWS = 28;
    const camera = { x: 0, y: 0 };
    const ZONES = [
      { name: 'Bosque del Pueblo', grass: ['#579d48', '#5ca34b', '#529744'], grassDetail: '#45883b', grassLight: '#75b75a', path: ['#d8b876', '#d3b06c', '#dfc080'], pathDetail: '#c39d5f', pathLight: '#ead29a', water: '#2479a0', waterLight: '#8bd7d0', shore: '#65b9b0', canopyDark: '#1e5e32', canopy: '#2f7d42', canopyLight: '#4c9850', trunk: '#704c31', mountain: '#697b79', mountainLight: '#879795', snow: '#e4eee5', cactus: false },
      { name: 'Pantano de las Brumas', grass: ['#71895a', '#778f5e', '#697e52'], grassDetail: '#465e43', grassLight: '#9ca96a', path: ['#98805a', '#a18a60', '#8e7652'], pathDetail: '#665940', pathLight: '#c0a976', water: '#426e68', waterLight: '#91c3a0', shore: '#789f81', canopyDark: '#354b3a', canopy: '#526b49', canopyLight: '#899963', trunk: '#69543c', mountain: '#687873', mountainLight: '#87978a', snow: '#c8d2bb', cactus: false },
      { name: 'Dunas Carmesí', grass: ['#c79a58', '#d0a565', '#bd8f4f'], grassDetail: '#9f7040', grassLight: '#e1c17e', path: ['#ead19a', '#e1c489', '#f0d9a4'], pathDetail: '#c49c62', pathLight: '#fff0c4', water: '#278da0', waterLight: '#a4e9d8', shore: '#74c5b4', canopyDark: '#665337', canopy: '#92764a', canopyLight: '#c2a568', trunk: '#72513a', mountain: '#876544', mountainLight: '#c39762', snow: '#f0dcae', cactus: true },
      { name: 'Cumbres Heladas', grass: ['#a8c6c5', '#b5d0ce', '#9ebcbd'], grassDetail: '#759b9f', grassLight: '#d8e8dc', path: ['#d8e4dc', '#c8d9da', '#e7eee2'], pathDetail: '#9ab5bb', pathLight: '#f5f7e9', water: '#397f9f', waterLight: '#b4f0ef', shore: '#87c9d0', canopyDark: '#315d67', canopy: '#447e83', canopyLight: '#82b3aa', trunk: '#625e58', mountain: '#748c98', mountainLight: '#a5bac0', snow: '#f3fbf0', cactus: false },
      { name: 'Tierras Umbrías', grass: ['#526a56', '#5b705a', '#495f53'], grassDetail: '#34483f', grassLight: '#78906a', path: ['#8d7181', '#957a88', '#826779'], pathDetail: '#5e4d62', pathLight: '#b69aa5', water: '#394d68', waterLight: '#8b90c2', shore: '#697a9a', canopyDark: '#293847', canopy: '#3e5360', canopyLight: '#6a7386', trunk: '#534048', mountain: '#505866', mountainLight: '#79818b', snow: '#a9b0c0', cactus: false }
    ];

    const TILE = {
      GRASS: 0,
      PATH: 1,
      WATER: 2,
      TREE: 3,
      MOUNTAIN: 4,
      HOUSE_WALL: 5,
      HOUSE_ROOF: 6,
      HOUSE_DOOR: 7,
      FLOWER: 8
    };

    function generateMap(level = 1) {
      if (level > 1) {
        const world = Array.from({ length: MAP_ROWS }, (_, y) =>
          Array.from({ length: MAP_COLS }, (_, x) => {
            const border = x === 0 || y === 0 || x === MAP_COLS - 1 || y === MAP_ROWS - 1;
            if (border) return TILE.MOUNTAIN;

            const ridge = Math.sin((x + level * 7) * 0.46) * Math.cos((y - level * 5) * 0.58);
            const riverX = 22 + Math.round(5 * Math.sin(y * 0.31 + level));
            const swampRiver = level === 2 && Math.abs(x - riverX) <= 1 && y > 2 && y < 25;
            const iceRiver = level === 4 && Math.abs(x - (11 + Math.round(y * 0.55))) <= 1;
            const shadowPond = level === 5 && ((x - 8) ** 2 + (y - 19) ** 2 < 12 || (x - 31) ** 2 + (y - 9) ** 2 < 16);
            const oasis = level === 3 && ((x - 9) ** 2 + (y - 9) ** 2 < 8 || (x - 30) ** 2 + (y - 19) ** 2 < 10);

            if (swampRiver || iceRiver || shadowPond || oasis) return TILE.WATER;
            if (level === 3 && ridge > 0.66) return TILE.MOUNTAIN;
            if (ridge > (level === 5 ? 0.66 : 0.76)) return TILE.TREE;
            if (ridge < -0.82) return TILE.FLOWER;
            return TILE.GRASS;
          })
        );

        for (let y = 2; y < MAP_ROWS - 1; y++) {
          for (let x = 2; x < MAP_COLS - 1; x++) {
            const safeStart = x >= 9 && x <= 19 && y >= 2 && y <= 7;
            let route = false;
            if (level === 2) route = y === 14 || x === 18 + Math.round(6 * Math.sin(y * 0.23));
            else if (level === 3) route = y === 13 || x === 8 + Math.round(y * 0.45);
            else if (level === 4) route = y === 19 || x === 29 - Math.round(y * 0.55);
            else route = y === 7 || y === 20 || x === 19 + Math.round(5 * Math.sin(y * 0.27));
            if (safeStart || route) world[y][x] = TILE.PATH;
          }
        }
        return world;
      }

      const world = Array.from({ length: MAP_ROWS }, (_, y) =>
        Array.from({ length: MAP_COLS }, (_, x) => {
          const border = x === 0 || y === 0 || x === MAP_COLS - 1 || y === MAP_ROWS - 1;
          if (border) return TILE.MOUNTAIN;

          const lake = (x >= 18 && x <= 27 && y >= 12 && y <= 18) || (x >= 30 && x <= 36 && y >= 8 && y <= 12);
          if (lake) return TILE.WATER;

          const houseArea = (x >= 6 && x <= 10 && y >= 6 && y <= 9) || (x >= 12 && x <= 16 && y >= 16 && y <= 19);
          if (houseArea) return TILE.HOUSE_WALL;

          const roofArea = (x >= 6 && x <= 10 && y >= 4 && y <= 6) || (x >= 12 && x <= 16 && y >= 14 && y <= 16);
          if (roofArea) return TILE.HOUSE_ROOF;

          const villagePath = (y >= 8 && y <= 11 && x >= 2 && x <= 36) || (x >= 14 && x <= 18 && y >= 2 && y <= 22);
          if (villagePath) return TILE.PATH;

          const forest = (x >= 1 && x <= 12 && y >= 18 && y <= 25) || (x >= 28 && x <= 38 && y >= 20 && y <= 25);
          if (forest) return TILE.TREE;

          if ((x >= 21 && x <= 24 && y >= 4 && y <= 7) || (x >= 31 && x <= 35 && y >= 18 && y <= 21)) {
            return TILE.FLOWER;
          }

          return TILE.GRASS;
        })
      );

      for (let y = 8; y <= 11; y++) {
        for (let x = 2; x <= 36; x++) {
          world[y][x] = TILE.PATH;
        }
      }

      for (let y = 7; y <= 10; y++) {
        for (let x = 6; x <= 10; x++) {
          if (y === 9 && x === 8) world[y][x] = TILE.HOUSE_DOOR;
          else if (y === 6) world[y][x] = TILE.HOUSE_ROOF;
          else if (x >= 6 && x <= 10 && y >= 7 && y <= 9) world[y][x] = TILE.HOUSE_WALL;
        }
      }

      for (let y = 15; y <= 18; y++) {
        for (let x = 12; x <= 16; x++) {
          if (y === 17 && x === 14) world[y][x] = TILE.HOUSE_DOOR;
          else if (y === 14) world[y][x] = TILE.HOUSE_ROOF;
          else if (x >= 12 && x <= 16 && y >= 15 && y <= 18) world[y][x] = TILE.HOUSE_WALL;
        }
      }

      return world;
    }

    let map = generateMap(1);
    let spawnCandidatesMap = null;
    let spawnCandidates = [];

    function getSpawnCandidates() {
      if (spawnCandidatesMap !== map) {
        spawnCandidatesMap = map;
        spawnCandidates = [];
        for (let row = 2; row < MAP_ROWS - 2; row++) {
          for (let column = 2; column < MAP_COLS - 2; column++) {
            const tile = map[row][column];
            if (!isSolid(tile) && tile !== TILE.PATH) spawnCandidates.push({ x: column, y: row });
          }
        }
      }
      return spawnCandidates;
    }

    function isSolid(tile) {
      return [TILE.WATER, TILE.TREE, TILE.MOUNTAIN, TILE.HOUSE_WALL, TILE.HOUSE_ROOF].includes(tile);
    }

    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'KeyE' && isNearShop()) openShop();
    });
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, duration, type = 'square') {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const player = {
      x: 11 * TILE_SIZE,
      y: 5 * TILE_SIZE,
      width: 24,
      height: 24,
      speed: 3,
      dir: 'down',
      hp: 100,
      maxHp: 100,
      mana: 100,
      maxMana: 100,
      level: 1,
      xp: 0,
      maxXp: 100,
      kills: 0,
      gold: 0,
      damage: 20,
      magicDamage: 30,
      isAttacking: false,
      attackCooldown: 0,
      magicCooldown: 0,
      animFrame: 0,
      animTimer: 0
    };

    const enemies = [];
    const projectiles = [];
    const popups = [];
    const ENEMIES_PER_ZONE = 5;
    const MAX_ZONES = 5;
    let boss = null;
    let worldLevel = 1;
    let zoneKills = 0;

    const enemyTypesByZone = [
      [
        { name: 'Slime', color: '#2ecc71', hp: 30, speed: 1.2, exp: 25, gold: 10 },
        { name: 'Goblin', color: '#e67e22', hp: 50, speed: 1.6, exp: 45, gold: 18 }
      ],
      [
        { name: 'Sapo', color: '#83a943', hp: 38, speed: 1.1, exp: 32, gold: 13 },
        { name: 'Mosquito', color: '#6c9c8f', hp: 28, speed: 2, exp: 36, gold: 15 }
      ],
      [
        { name: 'Escorpion', color: '#cc793c', hp: 46, speed: 1.55, exp: 42, gold: 18 },
        { name: 'Saqueador', color: '#b64c36', hp: 58, speed: 1.65, exp: 52, gold: 22 }
      ],
      [
        { name: 'Lobo de Hielo', color: '#b6e0e5', hp: 52, speed: 1.8, exp: 54, gold: 22 },
        { name: 'Golem de Hielo', color: '#65aeba', hp: 82, speed: 0.85, exp: 62, gold: 27 }
      ],
      [
        { name: 'Espectro', color: '#8175b8', hp: 62, speed: 1.75, exp: 64, gold: 28 },
        { name: 'Demonio', color: '#c84b5c', hp: 90, speed: 1.5, exp: 78, gold: 34 }
      ]
    ];

    const bossTypesByZone = [
      { name: 'Rey Raíz', style: 'root', color: '#5d9142', aura: '#8de36f', auraLight: '#c0ffa4', shade: '#314d34', accent: '#d2b576', eyeColor: '#ffe873' },
      { name: 'Matriarca del Fango', style: 'toad', color: '#8c9e43', aura: '#a4d94d', auraLight: '#d8ff84', shade: '#46502c', accent: '#dbd38a', eyeColor: '#faed92' },
      { name: 'Escorpión Solar', style: 'scorpion', color: '#d18c3e', aura: '#ffb344', auraLight: '#ffdf87', shade: '#68402b', accent: '#f4d28c', eyeColor: '#fff078' },
      { name: 'Titán Glacial', style: 'titan', color: '#58aebc', aura: '#75ddf2', auraLight: '#c5ffff', shade: '#31556c', accent: '#e2ffff', eyeColor: '#c5ffff' },
      { name: 'Señor del Eclipse', style: 'eclipse', color: '#75417f', aura: '#c164eb', auraLight: '#f0a6ff', shade: '#2d183d', accent: '#d8718c', eyeColor: '#ff61c3' }
    ];

    function addPopup(text, x, y, color = '#ffffff') {
      popups.push({ text, x, y, color, life: 40 });
    }

    function spawnEnemy() {
      if (enemies.length >= 8 || boss) return;
      const candidates = getSpawnCandidates();
      if (candidates.length === 0) return;

      const spawn = candidates[Math.floor(Math.random() * candidates.length)];

      const types = enemyTypesByZone[worldLevel - 1];
      const type = types[Math.floor(Math.random() * types.length)];
      const difficulty = 1 + (worldLevel - 1) * 0.2;
      enemies.push({
        x: spawn.x * TILE_SIZE + 4,
        y: spawn.y * TILE_SIZE + 4,
        width: 24,
        height: 24,
        hp: Math.round(type.hp * difficulty),
        maxHp: Math.round(type.hp * difficulty),
        name: type.name,
        color: type.color,
        speed: Math.min(type.speed + (worldLevel - 1) * 0.08, 2.4),
        exp: Math.round(type.exp * difficulty),
        gold: Math.round(type.gold * difficulty),
        dir: 'down',
        isBoss: false
      });
    }

    function spawnBoss() {
      if (boss) return;
      const design = bossTypesByZone[worldLevel - 1];
      boss = {
        x: 18 * TILE_SIZE - 8,
        y: 3 * TILE_SIZE - 8,
        width: 52,
        height: 52,
        hp: 260 + (worldLevel - 1) * 140,
        maxHp: 260 + (worldLevel - 1) * 140,
        name: design.name,
        bossStyle: design.style,
        color: design.color,
        aura: design.aura,
        auraLight: design.auraLight,
        shade: design.shade,
        accent: design.accent,
        eyeColor: design.eyeColor,
        speed: 1.15 + worldLevel * 0.08,
        exp: 120 + (worldLevel - 1) * 40,
        gold: 75 + (worldLevel - 1) * 30,
        dir: 'left',
        isBoss: true,
        attackDelay: 48
      };
      addPopup(`¡${boss.name.toUpperCase()}!`, boss.x, boss.y - 20, boss.auraLight);
      playSound(180, 0.25, 'triangle');
    }

    function isNearShop() {
      const shopZone = { x: 15 * TILE_SIZE, y: 2 * TILE_SIZE, w: 4 * TILE_SIZE, h: 3 * TILE_SIZE };
      return (
        player.x + player.width > shopZone.x &&
        player.x < shopZone.x + shopZone.w &&
        player.y + player.height > shopZone.y &&
        player.y < shopZone.y + shopZone.h
      );
    }

    function updateMissionText() {
      const missionText = document.getElementById('mission-txt');
      if (boss) {
        missionText.textContent = `MISIÓN: Derrota a ${boss.name}`;
      } else if (zoneKills >= ENEMIES_PER_ZONE) {
        missionText.textContent = `MISIÓN: Enfrenta al guardián ${worldLevel}/${MAX_ZONES}`;
      } else {
        missionText.textContent = `MISIÓN: Mata ${ENEMIES_PER_ZONE - zoneKills} enemigos más`;
      }
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function checkCollision(nx, ny) {
      const margin = 4;
      const points = [
        { x: nx + margin, y: ny + margin },
        { x: nx + player.width - margin, y: ny + margin },
        { x: nx + margin, y: ny + player.height - margin },
        { x: nx + player.width - margin, y: ny + player.height - margin }
      ];

      for (const p of points) {
        const tileX = Math.floor(p.x / TILE_SIZE);
        const tileY = Math.floor(p.y / TILE_SIZE);
        if (tileY < 0 || tileY >= MAP_ROWS || tileX < 0 || tileX >= MAP_COLS) return true;
        if (isSolid(map[tileY][tileX])) return true;
      }
      return false;
    }

    function buyItem(type) {
      if (!isNearShop()) {
        addPopup('Ve a la tienda', player.x, player.y - 20, '#f1c40f');
        return;
      }

      if (type === 'potion' && player.gold >= 25) {
        player.gold -= 25;
        player.hp = Math.min(player.maxHp, player.hp + 30);
        addPopup('+30 HP', player.x, player.y - 20, '#2ecc71');
      } else if (type === 'mana' && player.gold >= 20) {
        player.gold -= 20;
        player.mana = Math.min(player.maxMana, player.mana + 35);
        addPopup('+35 MANA', player.x, player.y - 20, '#3498db');
      } else if (type === 'sword' && player.gold >= 60) {
        player.gold -= 60;
        player.damage += 10;
        addPopup('Espada mejorada', player.x, player.y - 20, '#f39c12');
      } else if (type === 'armor' && player.gold >= 80) {
        player.gold -= 80;
        player.maxHp += 25;
        player.hp = player.maxHp;
        addPopup('Armadura mejorada', player.x, player.y - 20, '#9b59b6');
      } else {
        addPopup('Falta oro', player.x, player.y - 20, '#e74c3c');
      }
      playSound(440, 0.08, 'square');
      updateHud();
      closeShop();
    }

    const shopPanel = document.getElementById('shop-panel');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayText = document.getElementById('overlay-text');
    const startBtn = document.getElementById('start-btn');

    function openShop() {
      shopPanel.classList.remove('hidden');
    }

    function closeShop() {
      shopPanel.classList.add('hidden');
    }

    function castMagic() {
      if (player.magicCooldown > 0 || player.mana < 20 || !gameStarted || gameEnded) return;
      player.mana -= 20;
      player.magicCooldown = 28;

      const dx = (player.dir === 'left' ? -1 : player.dir === 'right' ? 1 : 0);
      const dy = (player.dir === 'up' ? -1 : player.dir === 'down' ? 1 : 0);

      projectiles.push({
        x: player.x + 10,
        y: player.y + 10,
        vx: dx * 6,
        vy: dy * 6,
        radius: 6,
        damage: player.magicDamage,
        color: '#8e44ad',
        owner: 'player'
      });
      playSound(620, 0.12, 'sawtooth');
    }

    function handleEnemyDefeat(enemy) {
      if (enemy.isBoss) {
        player.xp += enemy.exp;
        player.gold += enemy.gold;
        boss = null;
        player.kills += 1;
        if (worldLevel >= MAX_ZONES) {
          addPopup('¡VICTORIA FINAL!', enemy.x, enemy.y - 30, '#f1c40f');
          enemies.length = 0;
          projectiles.length = 0;
          gameEnded = true;
          setTimeout(() => showOverlay('¡Victoria!', 'Has superado las cinco zonas y derrotado al guardián final.', 'Jugar otra vez'), 600);
          updateHud();
          document.getElementById('mission-txt').textContent = 'MISIÓN: Zonas completadas';
          return;
        }

        worldLevel++;
        zoneKills = 0;
        map = generateMap(worldLevel);
        enemies.length = 0;
        projectiles.length = 0;
        player.x = 11 * TILE_SIZE;
        player.y = 5 * TILE_SIZE;
        camera.x = 0;
        camera.y = 0;
        player.hp = player.maxHp;
        player.mana = player.maxMana;
        addPopup(`¡ZONA ${worldLevel}!`, player.x, player.y - 24, '#f1c40f');
        for (let i = 0; i < Math.min(4 + worldLevel, 8); i++) spawnEnemy();
        playSound(520, 0.3, 'triangle');
        updateHud();
        return;
      }

      player.xp += enemy.exp;
      player.gold += enemy.gold;
      player.kills++;
      zoneKills++;
      addPopup(`+${enemy.exp} XP`, enemy.x, enemy.y - 10, '#3498db');
      const index = enemies.indexOf(enemy);
      if (index >= 0) enemies.splice(index, 1);

      if (player.xp >= player.maxXp) {
        player.level++;
        player.xp -= player.maxXp;
        player.maxXp = Math.floor(player.maxXp * 1.5);
        player.maxHp += 20;
        player.maxMana += 15;
        player.hp = player.maxHp;
        player.mana = player.maxMana;
        addPopup('¡NIVEL UP!', player.x - 20, player.y - 20, '#f1c40f');
        playSound(600, 0.3, 'triangle');
      }

      if (zoneKills >= ENEMIES_PER_ZONE && !boss) {
        spawnBoss();
      }

      updateMissionText();
      updateHud();
      setTimeout(spawnEnemy, 1000);
    }

    function updatePlayer() {
      let dx = 0;
      let dy = 0;

      if (keys['KeyW'] || keys['ArrowUp']) { dy = -1; player.dir = 'up'; }
      if (keys['KeyS'] || keys['ArrowDown']) { dy = 1; player.dir = 'down'; }
      if (keys['KeyA'] || keys['ArrowLeft']) { dx = -1; player.dir = 'left'; }
      if (keys['KeyD'] || keys['ArrowRight']) { dx = 1; player.dir = 'right'; }

      if (dx !== 0 && dy !== 0) {
        dx *= 0.7071;
        dy *= 0.7071;
      }

      const nextX = player.x + dx * player.speed;
      const nextY = player.y + dy * player.speed;

      if (!checkCollision(nextX, player.y)) player.x = nextX;
      if (!checkCollision(player.x, nextY)) player.y = nextY;

      player.x = clamp(player.x, 0, MAP_COLS * TILE_SIZE - player.width);
      player.y = clamp(player.y, 0, MAP_ROWS * TILE_SIZE - player.height);

      camera.x = clamp(player.x - canvas.width / 2, 0, MAP_COLS * TILE_SIZE - canvas.width);
      camera.y = clamp(player.y - canvas.height / 2, 0, MAP_ROWS * TILE_SIZE - canvas.height);

      if (dx !== 0 || dy !== 0) {
        player.animTimer++;
        if (player.animTimer % 8 === 0) player.animFrame = (player.animFrame + 1) % 4;
      }

      if ((keys['Space'] || keys['KeyJ']) && player.attackCooldown <= 0 && !gameEnded) {
        player.isAttacking = true;
        player.attackCooldown = 18;
        playSound(400, 0.1, 'sawtooth');

        const attackBox = { x: player.x, y: player.y, w: 32, h: 32 };
        const attackX = player.dir === 'left' ? attackBox.x - 28 : player.dir === 'right' ? attackBox.x + 28 : attackBox.x;
        const attackY = player.dir === 'up' ? attackBox.y - 28 : player.dir === 'down' ? attackBox.y + 28 : attackBox.y;

        const targets = boss ? [...enemies, boss] : [...enemies];
        targets.forEach((enemy) => {
          const box = { x: attackX, y: attackY, w: 32, h: 32 };
          if (
            box.x < enemy.x + enemy.width &&
            box.x + box.w > enemy.x &&
            box.y < enemy.y + enemy.height &&
            box.y + box.h > enemy.y
          ) {
            const dmg = player.damage;
            enemy.hp -= dmg;
            addPopup(`-${dmg}`, enemy.x, enemy.y, '#f39c12');
            playSound(180, 0.15, 'square');
            if (enemy.hp <= 0) handleEnemyDefeat(enemy);
          }
        });
      }

      if (player.attackCooldown > 0) {
        player.attackCooldown--;
        if (player.attackCooldown < 10) player.isAttacking = false;
      }

      if (keys['KeyK']) castMagic();
      if (player.magicCooldown > 0) player.magicCooldown--;
      if (player.mana < player.maxMana) player.mana = Math.min(player.maxMana, player.mana + 0.08);
    }

    function handlePlayerDefeat() {
      player.hp = player.maxHp;
      player.x = 11 * TILE_SIZE;
      player.y = 5 * TILE_SIZE;
      camera.x = 0;
      camera.y = 0;
      addPopup('¡HAS SIDO DERROTADO!', player.x - 30, player.y, '#e74c3c');
      showOverlay('Derrota', 'Volviste al pueblo. Intenta de nuevo.', 'Reintentar');
      gameEnded = true;
    }

    function fireBossProjectile(enemy) {
      const dx = player.x + player.width / 2 - (enemy.x + enemy.width / 2);
      const dy = player.y + player.height / 2 - (enemy.y + enemy.height / 2);
      const distance = Math.hypot(dx, dy) || 1;
      const speed = 4.2;

      projectiles.push({
        x: enemy.x + enemy.width / 2,
        y: enemy.y + enemy.height / 2,
        vx: (dx / distance) * speed,
        vy: (dy / distance) * speed,
        radius: 8,
        damage: 10 + worldLevel * 3,
        color: enemy.aura,
        owner: 'boss'
      });
      enemy.attackDelay = Math.max(58, 96 - worldLevel * 6);
      addPopup('¡MAGIA!', enemy.x, enemy.y - 12, enemy.auraLight);
      playSound(260 + worldLevel * 35, 0.12, 'triangle');
    }

    function updateEnemies() {
      const targets = [...enemies];
      if (boss) targets.push(boss);

      targets.forEach((enemy) => {
        const dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
        const detectionRange = enemy.isBoss ? 520 : 180;
        const stopDistance = enemy.isBoss ? 130 : 20;
        if (dist < detectionRange && dist > stopDistance) {
          const ex = (player.x - enemy.x) / dist;
          const ey = (player.y - enemy.y) / dist;
          enemy.x += ex * enemy.speed;
          enemy.y += ey * enemy.speed;
        }

        if (enemy.isBoss) {
          if (enemy.attackDelay > 0) enemy.attackDelay--;
          if (dist < detectionRange && enemy.attackDelay <= 0) fireBossProjectile(enemy);
        }

        if (dist < 22) {
          player.hp -= enemy.isBoss ? 0.7 : 0.4;
          if (Math.random() < 0.08) {
            addPopup('-5', player.x, player.y, '#e74c3c');
            playSound(120, 0.1, 'sawtooth');
          }
          if (player.hp <= 0) {
            handlePlayerDefeat();
          }
        }
      });
    }

    function updateProjectiles() {
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        if (!p) break;
        p.x += p.vx;
        p.y += p.vy;

        let hit = false;
        if (p.owner === 'boss') {
          if (
            p.x + p.radius > player.x && p.x - p.radius < player.x + player.width &&
            p.y + p.radius > player.y && p.y - p.radius < player.y + player.height
          ) {
            player.hp = Math.max(0, player.hp - p.damage);
            addPopup(`-${p.damage}`, player.x, player.y, '#e74c3c');
            playSound(140, 0.08, 'sawtooth');
            if (player.hp <= 0) handlePlayerDefeat();
            hit = true;
          }
        } else {
          const targets = boss ? [...enemies, boss] : [...enemies];
          for (const enemy of targets) {
            if (
              p.x > enemy.x && p.x < enemy.x + enemy.width &&
              p.y > enemy.y && p.y < enemy.y + enemy.height
            ) {
              enemy.hp -= p.damage;
              addPopup(`-${p.damage}`, enemy.x, enemy.y, '#8e44ad');
              if (enemy.hp <= 0) handleEnemyDefeat(enemy);
              hit = true;
              break;
            }
          }
        }

        if (hit || p.x < 0 || p.y < 0 || p.x > MAP_COLS * TILE_SIZE || p.y > MAP_ROWS * TILE_SIZE) {
          projectiles.splice(i, 1);
        }
      }
    }

    function updatePopups() {
      for (let i = popups.length - 1; i >= 0; i--) {
        popups[i].y -= 0.8;
        popups[i].life--;
        if (popups[i].life <= 0) popups.splice(i, 1);
      }
    }

    function updateHud() {
      document.getElementById('level-txt').innerText = `Nv. ${player.level}`;
      document.getElementById('zone-txt').innerText = `· ZONA ${worldLevel}/${MAX_ZONES}`;
      document.getElementById('zone-name').innerText = ZONES[worldLevel - 1].name.toUpperCase();
      document.getElementById('kills-txt').innerText = player.kills;
      document.getElementById('gold-txt').innerText = `ORO: ${player.gold}`;
      document.getElementById('hp-bar').style.width = `${Math.max(0, (player.hp / player.maxHp) * 100)}%`;
      document.getElementById('mana-bar').style.width = `${Math.max(0, (player.mana / player.maxMana) * 100)}%`;
      document.getElementById('xp-bar').style.width = `${Math.min(100, (player.xp / player.maxXp) * 100)}%`;
      updateMissionText();
    }

    function update() {
      if (!gameStarted || gameEnded) return;
      updatePlayer();
      updateEnemies();
      updateProjectiles();
      updatePopups();
      updateHud();
    }

    function drawTile(tile, x, y) {
      const px = x - camera.x;
      const py = y - camera.y;
      const tileCol = Math.floor(x / TILE_SIZE);
      const tileRow = Math.floor(y / TILE_SIZE);
      const variation = Math.abs((tileCol * 17 + tileRow * 31 + tileCol * tileRow * 7) % 3);
      const theme = ZONES[worldLevel - 1];

      switch (tile) {
        case TILE.GRASS:
          ctx.fillStyle = theme.grass[variation];
          ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
          ctx.fillStyle = theme.grassDetail;
          ctx.fillRect(px + 4 + variation * 7, py + 7 + variation * 3, 2, 5);
          ctx.fillRect(px + 19 - variation * 3, py + 20 - variation * 4, 2, 4);
          ctx.fillStyle = theme.grassLight;
          ctx.fillRect(px + 8 + variation * 5, py + 24 - variation * 2, 3, 2);
          break;

        case TILE.PATH:
          ctx.fillStyle = theme.path[variation];
          ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
          ctx.fillStyle = theme.pathDetail;
          ctx.fillRect(px + 4 + variation * 5, py + 5, 4, 2);
          ctx.fillRect(px + 20 - variation * 3, py + 17 + variation * 3, 3, 3);
          ctx.fillStyle = theme.pathLight;
          ctx.fillRect(px + 11 + variation * 2, py + 25 - variation * 4, 5, 2);
          break;

        case TILE.WATER:
          ctx.fillStyle = theme.water;
          ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
          if (map[tileRow - 1]?.[tileCol] !== TILE.WATER) {
            ctx.fillStyle = theme.shore;
            ctx.fillRect(px, py, TILE_SIZE, 3);
          }
          if (map[tileRow + 1]?.[tileCol] !== TILE.WATER) {
            ctx.fillStyle = theme.shore;
            ctx.fillRect(px, py + TILE_SIZE - 3, TILE_SIZE, 3);
          }
          if (map[tileRow]?.[tileCol - 1] !== TILE.WATER) {
            ctx.fillStyle = theme.shore;
            ctx.fillRect(px, py, 3, TILE_SIZE);
          }
          if (map[tileRow]?.[tileCol + 1] !== TILE.WATER) {
            ctx.fillStyle = theme.shore;
            ctx.fillRect(px + TILE_SIZE - 3, py, 3, TILE_SIZE);
          }
          ctx.fillStyle = theme.waterLight;
          ctx.fillRect(px + ((Date.now() / 240 + tileCol * 7) % 20), py + 9 + variation * 5, 8, 2);
          ctx.fillStyle = theme.shore;
          ctx.fillRect(px + 5 + variation * 6, py + 23 - variation * 3, 5, 2);
          break;

        case TILE.TREE:
          ctx.fillStyle = theme.grass[variation];
          ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
          ctx.fillStyle = 'rgba(26, 54, 31, 0.28)';
          ctx.beginPath();
          ctx.ellipse(px + 17, py + 27, 13, 4, 0, 0, Math.PI * 2);
          ctx.fill();
          if (theme.cactus) {
            ctx.fillStyle = theme.trunk;
            ctx.fillRect(px + 13, py + 10, 7, 20);
            ctx.fillRect(px + 7, py + 15, 6, 4);
            ctx.fillRect(px + 7, py + 11, 4, 8);
            ctx.fillRect(px + 20, py + 19, 6, 4);
            ctx.fillRect(px + 22, py + 14, 4, 9);
            ctx.fillStyle = theme.canopyLight;
            ctx.fillRect(px + 14, py + 12, 2, 15);
            ctx.fillRect(px + 8, py + 13, 2, 4);
            ctx.fillRect(px + 23, py + 16, 2, 5);
          } else {
            ctx.fillStyle = theme.trunk;
            ctx.fillRect(px + 13, py + 14, 7, 17);
            ctx.fillStyle = theme.canopyDark;
            ctx.beginPath();
            ctx.arc(px + 16, py + 13, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = theme.canopy;
            ctx.beginPath();
            ctx.arc(px + 12, py + 11, 9, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = theme.canopyLight;
            ctx.beginPath();
            ctx.arc(px + 10 + variation, py + 8, 4, 0, Math.PI * 2);
            ctx.fill();
          }
          break;

        case TILE.MOUNTAIN:
          ctx.fillStyle = theme.mountain;
          ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
          ctx.fillStyle = theme.mountainLight;
          ctx.beginPath();
          ctx.moveTo(px + 16, py + 3);
          ctx.lineTo(px + 3, py + 29);
          ctx.lineTo(px + 29, py + 29);
          ctx.fill();
          ctx.fillStyle = theme.snow;
          ctx.beginPath();
          ctx.moveTo(px + 16, py + 3);
          ctx.lineTo(px + 10, py + 15);
          ctx.lineTo(px + 16, py + 12);
          ctx.lineTo(px + 21, py + 17);
          ctx.fill();
          ctx.fillStyle = theme.mountain;
          ctx.fillRect(px + 5, py + 25, 6, 2);
          ctx.fillRect(px + 21, py + 22, 5, 2);
          break;

        case TILE.HOUSE_WALL:
          ctx.fillStyle = '#e8a64e';
          ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
          ctx.fillStyle = '#c4773c';
          ctx.fillRect(px, py, TILE_SIZE, 4);
          ctx.fillStyle = '#f4c878';
          ctx.fillRect(px, py + 5, TILE_SIZE, 2);
          ctx.fillStyle = '#c98043';
          ctx.fillRect(px + 3, py + 14, 10, 2);
          ctx.fillRect(px + 19, py + 25, 9, 2);
          if ((tileCol === 7 && tileRow === 7) || (tileCol === 15 && tileRow === 15)) {
            ctx.fillStyle = '#704c3b';
            ctx.fillRect(px + 7, py + 9, 18, 12);
            ctx.fillStyle = '#82c9cf';
            ctx.fillRect(px + 9, py + 11, 14, 8);
            ctx.fillStyle = '#f3d47e';
            ctx.fillRect(px + 15, py + 11, 2, 8);
            ctx.fillRect(px + 9, py + 14, 14, 2);
          }
          break;

        case TILE.HOUSE_ROOF:
          ctx.fillStyle = '#9f3932';
          ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
          ctx.fillStyle = '#bd5140';
          ctx.fillRect(px + 2, py + 3, 12, 5);
          ctx.fillRect(px + 17, py + 3, 12, 5);
          ctx.fillRect(px + 9, py + 11, 13, 5);
          ctx.fillRect(px + 2, py + 19, 12, 5);
          ctx.fillRect(px + 17, py + 19, 12, 5);
          ctx.fillStyle = '#7b302d';
          ctx.fillRect(px, py + TILE_SIZE - 3, TILE_SIZE, 3);
          ctx.fillStyle = '#d97855';
          ctx.fillRect(px + 3, py + 9, 10, 2);
          ctx.fillRect(px + 19, py + 17, 10, 2);
          break;

        case TILE.HOUSE_DOOR:
          ctx.fillStyle = '#e8a64e';
          ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
          ctx.fillStyle = '#70452e';
          ctx.fillRect(px + 7, py + 5, 18, 27);
          ctx.fillStyle = '#a9683e';
          ctx.fillRect(px + 10, py + 8, 12, 24);
          ctx.fillStyle = '#854d32';
          ctx.fillRect(px + 15, py + 9, 2, 22);
          ctx.fillStyle = '#f0c66c';
          ctx.fillRect(px + 19, py + 19, 2, 3);
          ctx.fillStyle = '#c4773c';
          ctx.fillRect(px + 5, py + 4, 22, 3);
          break;

        case TILE.FLOWER:
          ctx.fillStyle = theme.grass[variation];
          ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
          ctx.fillStyle = theme.grassDetail;
          ctx.fillRect(px + 9, py + 13, 2, 12);
          ctx.fillRect(px + 21, py + 8, 2, 14);
          ctx.fillRect(px + 9, py + 19, 5, 2);
          ctx.fillRect(px + 17, py + 15, 5, 2);
          ctx.fillStyle = variation === 1 ? '#f7d84a' : '#f2c94c';
          ctx.beginPath();
          ctx.arc(px + 10, py + 11, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#f3eee0';
          ctx.beginPath();
          ctx.arc(px + 22, py + 6, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#d87555';
          ctx.beginPath();
          ctx.arc(px + 19, py + 22, 3, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#704f31';
          ctx.fillRect(px + 9, py + 10, 2, 2);
          ctx.fillRect(px + 21, py + 5, 2, 2);
          break;
      }
    }

    function drawBoss(enemy, px, py) {
      const time = Date.now();
      const pulse = 0.5 + Math.sin(time / 180) * 0.5;

      ctx.save();
      ctx.globalAlpha = 0.14 + pulse * 0.12;
      ctx.fillStyle = enemy.aura;
      ctx.beginPath();
      ctx.arc(px + 26, py + 27, 30 + pulse * 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 0.75;
      ctx.strokeStyle = enemy.auraLight;
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      ctx.lineDashOffset = -time / 90;
      ctx.beginPath();
      ctx.arc(px + 26, py + 27, 34, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      for (let i = 0; i < 3; i++) {
        const angle = time / 600 + i * Math.PI * 2 / 3;
        const orbX = px + 26 + Math.cos(angle) * 37;
        const orbY = py + 27 + Math.sin(angle) * 18;
        ctx.shadowColor = enemy.auraLight;
        ctx.shadowBlur = 12;
        ctx.fillStyle = i === 1 ? enemy.eyeColor : enemy.auraLight;
        ctx.beginPath();
        ctx.arc(orbX, orbY, 3 + pulse, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      ctx.fillStyle = enemy.shade;
      ctx.strokeStyle = enemy.shade;
      ctx.lineWidth = 6;
      if (enemy.bossStyle === 'root') {
        ctx.beginPath();
        ctx.moveTo(px + 18, py + 19);
        ctx.lineTo(px + 8, py + 3);
        ctx.lineTo(px + 3, py + 1);
        ctx.moveTo(px + 12, py + 12);
        ctx.lineTo(px + 4, py + 9);
        ctx.moveTo(px + 34, py + 19);
        ctx.lineTo(px + 44, py + 3);
        ctx.lineTo(px + 49, py + 1);
        ctx.moveTo(px + 40, py + 12);
        ctx.lineTo(px + 48, py + 9);
        ctx.stroke();
      } else if (enemy.bossStyle === 'toad') {
        ctx.beginPath();
        ctx.ellipse(px + 26, py + 38, 25, 15, 0, 0, Math.PI * 2);
        ctx.fill();
      } else if (enemy.bossStyle === 'scorpion') {
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(px + 33, py + 29);
        ctx.bezierCurveTo(px + 53, py + 20, px + 47, py + 3, px + 34, py + 4);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(px + 4, py + 34, 8, 0, Math.PI * 2);
        ctx.arc(px + 48, py + 34, 8, 0, Math.PI * 2);
        ctx.fill();
      } else if (enemy.bossStyle === 'titan') {
        ctx.beginPath();
        ctx.moveTo(px + 10, py + 25);
        ctx.lineTo(px + 1, py + 9);
        ctx.lineTo(px + 17, py + 17);
        ctx.closePath();
        ctx.moveTo(px + 42, py + 25);
        ctx.lineTo(px + 51, py + 9);
        ctx.lineTo(px + 35, py + 17);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.moveTo(px + 15, py + 21);
        ctx.lineTo(px - 2, py + 12);
        ctx.lineTo(px + 4, py + 36);
        ctx.lineTo(px + 15, py + 32);
        ctx.closePath();
        ctx.moveTo(px + 37, py + 21);
        ctx.lineTo(px + 54, py + 12);
        ctx.lineTo(px + 48, py + 36);
        ctx.lineTo(px + 37, py + 32);
        ctx.closePath();
        ctx.fill();
      }

      const armor = ctx.createLinearGradient(px + 4, py + 14, px + 48, py + 51);
      armor.addColorStop(0, enemy.auraLight);
      armor.addColorStop(0.55, enemy.color);
      armor.addColorStop(1, enemy.shade);
      ctx.fillStyle = enemy.accent;
      ctx.beginPath();
      ctx.moveTo(px + 14, py + 18);
      ctx.lineTo(px + 2, py + 4);
      ctx.lineTo(px + 7, py + 22);
      ctx.lineTo(px + 13, py + 27);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(px + 38, py + 18);
      ctx.lineTo(px + 50, py + 4);
      ctx.lineTo(px + 45, py + 22);
      ctx.lineTo(px + 39, py + 27);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = enemy.shade;
      ctx.beginPath();
      ctx.moveTo(px + 9, py + 27);
      ctx.lineTo(px + 13, py + 17);
      ctx.lineTo(px + 20, py + 14);
      ctx.lineTo(px + 32, py + 14);
      ctx.lineTo(px + 39, py + 17);
      ctx.lineTo(px + 43, py + 27);
      ctx.lineTo(px + 48, py + 48);
      ctx.lineTo(px + 37, py + 46);
      ctx.lineTo(px + 26, py + 53);
      ctx.lineTo(px + 15, py + 46);
      ctx.lineTo(px + 4, py + 48);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = armor;
      ctx.beginPath();
      ctx.ellipse(px + 26, py + 22, 14, 13, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = enemy.accent;
      ctx.beginPath();
      ctx.moveTo(px + 17, py + 12);
      ctx.lineTo(px + 15, py + 2);
      ctx.lineTo(px + 23, py + 9);
      ctx.lineTo(px + 26, py + 1);
      ctx.lineTo(px + 30, py + 9);
      ctx.lineTo(px + 38, py + 2);
      ctx.lineTo(px + 35, py + 13);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = enemy.shade;
      ctx.fillRect(px + 16, py + 20, 8, 4);
      ctx.fillRect(px + 28, py + 20, 8, 4);
      ctx.save();
      ctx.shadowColor = enemy.eyeColor;
      ctx.shadowBlur = 14 + pulse * 7;
      ctx.fillStyle = enemy.eyeColor;
      ctx.fillRect(px + 18, py + 21, 5, 2);
      ctx.fillRect(px + 29, py + 21, 5, 2);
      ctx.restore();

      ctx.fillStyle = enemy.accent;
      ctx.beginPath();
      ctx.moveTo(px + 26, py + 29);
      ctx.lineTo(px + 31, py + 36);
      ctx.lineTo(px + 26, py + 43);
      ctx.lineTo(px + 21, py + 36);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = enemy.color;
      ctx.fillRect(px + 24, py + 33, 4, 6);
      ctx.fillStyle = enemy.shade;
      ctx.fillRect(px + 11, py + 44, 12, 7);
      ctx.fillRect(px + 29, py + 44, 12, 7);

      if (enemy.bossStyle === 'root') {
        ctx.fillStyle = '#b9d969';
        ctx.fillRect(px + 10, py + 31, 6, 4);
        ctx.fillRect(px + 35, py + 34, 5, 4);
      } else if (enemy.bossStyle === 'toad') {
        ctx.fillStyle = enemy.eyeColor;
        ctx.beginPath();
        ctx.arc(px + 15, py + 16, 7, 0, Math.PI * 2);
        ctx.arc(px + 37, py + 16, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = enemy.shade;
        ctx.fillRect(px + 14, py + 15, 3, 5);
        ctx.fillRect(px + 36, py + 15, 3, 5);
      } else if (enemy.bossStyle === 'scorpion') {
        ctx.strokeStyle = enemy.accent;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(px + 26, py + 4);
        ctx.lineTo(px + 31, py - 2);
        ctx.lineTo(px + 36, py + 4);
        ctx.stroke();
      } else if (enemy.bossStyle === 'titan') {
        ctx.fillStyle = enemy.auraLight;
        ctx.beginPath();
        ctx.moveTo(px + 26, py + 28);
        ctx.lineTo(px + 34, py + 37);
        ctx.lineTo(px + 26, py + 46);
        ctx.lineTo(px + 18, py + 37);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillStyle = enemy.accent;
        ctx.beginPath();
        ctx.moveTo(px + 17, py + 13);
        ctx.lineTo(px + 13, py - 3);
        ctx.lineTo(px + 25, py + 7);
        ctx.lineTo(px + 38, py - 3);
        ctx.lineTo(px + 35, py + 13);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawDistinctEnemy(enemy, px, py) {
      switch (enemy.name) {
        case 'Sapo':
          ctx.fillStyle = '#536d36';
          ctx.fillRect(px + 4, py + 20, 6, 7);
          ctx.fillRect(px + 15, py + 20, 6, 7);
          ctx.fillStyle = '#83a943';
          ctx.beginPath();
          ctx.ellipse(px + 12, py + 17, 11, 8, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#d7e29a';
          ctx.beginPath();
          ctx.arc(px + 7, py + 11, 4, 0, Math.PI * 2);
          ctx.arc(px + 17, py + 11, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#30382b';
          ctx.fillRect(px + 6, py + 10, 2, 3);
          ctx.fillRect(px + 16, py + 10, 2, 3);
          break;
        case 'Mosquito':
          ctx.fillStyle = 'rgba(190, 231, 218, 0.78)';
          ctx.beginPath();
          ctx.ellipse(px + 7, py + 11, 7, 3, -0.5, 0, Math.PI * 2);
          ctx.ellipse(px + 17, py + 11, 7, 3, 0.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#4a706b';
          ctx.fillRect(px + 10, py + 11, 5, 11);
          ctx.fillRect(px + 11, py + 20, 3, 5);
          ctx.fillStyle = '#6c9c8f';
          ctx.beginPath();
          ctx.arc(px + 12, py + 10, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#d95b58';
          ctx.fillRect(px + 10, py + 9, 2, 2);
          ctx.fillRect(px + 14, py + 9, 2, 2);
          ctx.strokeStyle = '#4a706b';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(px + 12, py + 6);
          ctx.lineTo(px + 12, py + 1);
          ctx.stroke();
          break;
        case 'Escorpion':
          ctx.strokeStyle = '#a95d2f';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(px + 16, py + 13);
          ctx.quadraticCurveTo(px + 25, py + 7, px + 19, py + 2);
          ctx.stroke();
          ctx.fillStyle = '#e1a34d';
          ctx.beginPath();
          ctx.moveTo(px + 19, py + 2);
          ctx.lineTo(px + 23, py + 5);
          ctx.lineTo(px + 18, py + 6);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#a95d2f';
          ctx.fillRect(px + 1, py + 14, 6, 6);
          ctx.fillRect(px + 17, py + 14, 6, 6);
          ctx.fillStyle = '#cc793c';
          ctx.beginPath();
          ctx.ellipse(px + 12, py + 17, 9, 7, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#2c241e';
          ctx.fillRect(px + 8, py + 9, 2, 2);
          ctx.fillRect(px + 15, py + 9, 2, 2);
          break;
        case 'Saqueador':
          ctx.fillStyle = '#6d372e';
          ctx.fillRect(px + 5, py + 12, 14, 14);
          ctx.fillRect(px + 3, py + 7, 18, 8);
          ctx.fillStyle = '#d79a63';
          ctx.fillRect(px + 8, py + 10, 9, 9);
          ctx.fillStyle = '#39282b';
          ctx.fillRect(px + 7, py + 7, 10, 3);
          ctx.fillRect(px + 9, py + 13, 2, 2);
          ctx.fillRect(px + 15, py + 13, 2, 2);
          ctx.fillStyle = '#b64c36';
          ctx.fillRect(px + 4, py + 19, 16, 4);
          ctx.fillStyle = '#e0b05e';
          ctx.fillRect(px + 10, py + 20, 4, 3);
          break;
        case 'Lobo de Hielo':
          ctx.fillStyle = '#769da7';
          ctx.fillRect(px + 4, py + 18, 4, 8);
          ctx.fillRect(px + 15, py + 18, 4, 8);
          ctx.fillStyle = '#b6e0e5';
          ctx.beginPath();
          ctx.ellipse(px + 12, py + 17, 10, 7, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(px + 6, py + 13);
          ctx.lineTo(px + 4, py + 4);
          ctx.lineTo(px + 11, py + 10);
          ctx.lineTo(px + 18, py + 5);
          ctx.lineTo(px + 20, py + 14);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#477282';
          ctx.fillRect(px + 15, py + 12, 2, 3);
          ctx.fillStyle = '#fff';
          ctx.fillRect(px + 18, py + 17, 4, 3);
          break;
        case 'Golem de Hielo':
          ctx.fillStyle = '#43818e';
          ctx.fillRect(px + 4, py + 20, 7, 7);
          ctx.fillRect(px + 14, py + 20, 7, 7);
          ctx.fillStyle = '#65aeba';
          ctx.fillRect(px + 4, py + 10, 16, 13);
          ctx.fillRect(px + 6, py + 4, 12, 9);
          ctx.fillStyle = '#d7fbf4';
          ctx.beginPath();
          ctx.moveTo(px + 8, py + 5);
          ctx.lineTo(px + 10, py - 1);
          ctx.lineTo(px + 13, py + 5);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#294b58';
          ctx.fillRect(px + 8, py + 8, 3, 2);
          ctx.fillRect(px + 14, py + 8, 3, 2);
          break;
        case 'Espectro':
          ctx.save();
          ctx.globalAlpha = 0.82;
          ctx.shadowColor = '#a9a2ff';
          ctx.shadowBlur = 12;
          ctx.fillStyle = '#8175b8';
          ctx.beginPath();
          ctx.moveTo(px + 4, py + 25);
          ctx.lineTo(px + 5, py + 11);
          ctx.quadraticCurveTo(px + 12, py + 1, px + 19, py + 11);
          ctx.lineTo(px + 21, py + 25);
          ctx.lineTo(px + 16, py + 21);
          ctx.lineTo(px + 12, py + 26);
          ctx.lineTo(px + 8, py + 22);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
          ctx.fillStyle = '#f2e8ff';
          ctx.fillRect(px + 8, py + 13, 3, 3);
          ctx.fillRect(px + 15, py + 13, 3, 3);
          break;
        case 'Demonio':
          ctx.fillStyle = '#732f48';
          ctx.beginPath();
          ctx.moveTo(px + 7, py + 13);
          ctx.lineTo(px + 1, py + 4);
          ctx.lineTo(px + 10, py + 8);
          ctx.lineTo(px + 17, py + 8);
          ctx.lineTo(px + 23, py + 3);
          ctx.lineTo(px + 20, py + 15);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#c84b5c';
          ctx.beginPath();
          ctx.ellipse(px + 12, py + 17, 9, 10, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ffd56a';
          ctx.fillRect(px + 7, py + 14, 3, 2);
          ctx.fillRect(px + 15, py + 14, 3, 2);
          ctx.fillStyle = '#55273a';
          ctx.fillRect(px + 7, py + 24, 5, 4);
          ctx.fillRect(px + 14, py + 24, 5, 4);
          break;
      }
    }

    function drawEnemy(enemy) {
      const px = enemy.x - camera.x;
      const py = enemy.y - camera.y;

      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.beginPath();
      ctx.ellipse(px + (enemy.isBoss ? 26 : 12), py + enemy.height - 2, enemy.isBoss ? 30 : 13, enemy.isBoss ? 8 : 5, 0, 0, Math.PI * 2);
      ctx.fill();

      if (enemy.isBoss) {
        drawBoss(enemy, px, py);
      } else if (enemy.name === 'Goblin') {
        ctx.fillStyle = '#8d4b20';
        ctx.fillRect(px + 5, py + 23, 6, 7);
        ctx.fillRect(px + 14, py + 23, 6, 7);
        ctx.fillStyle = '#7cbd38';
        ctx.fillRect(px + 5, py + 11, 14, 14);
        ctx.fillRect(px + 3, py + 14, 4, 7);
        ctx.fillRect(px + 17, py + 14, 4, 7);
        ctx.fillStyle = '#a8dc55';
        ctx.fillRect(px + 7, py + 8, 10, 12);
        ctx.fillStyle = '#f4e8b2';
        ctx.fillRect(px + 4, py + 12, 5, 3);
        ctx.fillRect(px + 15, py + 12, 5, 3);
        ctx.fillStyle = '#25251d';
        ctx.fillRect(px + 7, py + 13, 2, 3);
        ctx.fillRect(px + 16, py + 13, 2, 3);
        ctx.fillStyle = '#63341c';
        ctx.fillRect(px + 9, py + 18, 6, 2);
        ctx.fillStyle = '#d6a63b';
        ctx.fillRect(px + 7, py + 22, 10, 3);
      } else if (enemy.name !== 'Slime') {
        drawDistinctEnemy(enemy, px, py);
      } else {
        ctx.fillStyle = '#188b57';
        ctx.beginPath();
        ctx.moveTo(px + 2, py + 20);
        ctx.quadraticCurveTo(px + 2, py + 9, px + 12, py + 9);
        ctx.quadraticCurveTo(px + 22, py + 9, px + 22, py + 20);
        ctx.lineTo(px + 19, py + 25);
        ctx.lineTo(px + 5, py + 25);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#45d483';
        ctx.beginPath();
        ctx.ellipse(px + 9, py + 14, 4, 2, -0.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(px + 7, py + 15, 4, 5);
        ctx.fillRect(px + 14, py + 15, 4, 5);
        ctx.fillStyle = '#173d2c';
        ctx.fillRect(px + 9, py + 17, 2, 3);
        ctx.fillRect(px + 15, py + 17, 2, 3);
      }

      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(px - (enemy.isBoss ? 7 : 2), py - (enemy.isBoss ? 13 : 8), enemy.isBoss ? 66 : 28, enemy.isBoss ? 7 : 5);
      ctx.fillStyle = enemy.isBoss ? enemy.aura : '#2ecc71';
      ctx.fillRect(px - (enemy.isBoss ? 5 : 1), py - (enemy.isBoss ? 11 : 7), Math.max(0, (enemy.hp / enemy.maxHp) * (enemy.isBoss ? 62 : 26)), 3);
    }

    function drawPlayer() {
      const px = player.x - camera.x;
      const py = player.y - camera.y;
      const step = player.animFrame % 2 === 0 ? 0 : 2;

      ctx.fillStyle = 'rgba(0,0,0,0.32)';
      ctx.beginPath();
      ctx.ellipse(px + 12, py + 23, 12, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#263c63';
      ctx.fillRect(px + 5, py + 18, 6, 7 - step);
      ctx.fillRect(px + 13, py + 18, 6, 5 + step);
      ctx.fillStyle = '#593b2a';
      ctx.fillRect(px + 4, py + 23 - step, 7, 3);
      ctx.fillRect(px + 13, py + 23 + step, 7, 3);

      ctx.fillStyle = '#8f2f32';
      ctx.fillRect(px + 4, py + 10, 16, 11);
      ctx.fillStyle = '#d94c45';
      ctx.fillRect(px + 6, py + 11, 12, 8);
      ctx.fillStyle = '#e5b94f';
      ctx.fillRect(px + 5, py + 19, 14, 2);
      ctx.fillRect(px + 11, py + 19, 3, 3);

      ctx.fillStyle = '#e6ad78';
      ctx.fillRect(px + 3, py + 12, 3, 7);
      ctx.fillRect(px + 18, py + 12, 3, 7);
      ctx.fillRect(px + 7, py + 3, 10, 9);
      ctx.fillStyle = '#6b3829';
      ctx.fillRect(px + 6, py + 2, 12, 4);
      ctx.fillRect(px + 5, py + 5, 3, 4);
      ctx.fillRect(px + 16, py + 5, 3, 4);

      ctx.fillStyle = '#34251f';
      if (player.dir === 'down') {
        ctx.fillRect(px + 8, py + 7, 2, 2);
        ctx.fillRect(px + 14, py + 7, 2, 2);
      } else if (player.dir === 'up') {
        ctx.fillStyle = '#6b3829';
        ctx.fillRect(px + 6, py + 4, 12, 6);
      } else if (player.dir === 'left') {
        ctx.fillRect(px + 7, py + 7, 2, 2);
      } else if (player.dir === 'right') {
        ctx.fillRect(px + 15, py + 7, 2, 2);
      }

      ctx.fillStyle = '#d9e1e8';
      if (player.dir === 'left') ctx.fillRect(px + 1, py + 13, 3, 8);
      else if (player.dir === 'right') ctx.fillRect(px + 20, py + 13, 3, 8);
      else if (player.dir === 'up') ctx.fillRect(px + 16, py + 14, 3, 7);
      else ctx.fillRect(px + 5, py + 14, 3, 7);

      if (player.isAttacking) {
        ctx.fillStyle = '#ecf0f1';
        ctx.strokeStyle = '#bdc3c7';
        ctx.lineWidth = 3;
        ctx.beginPath();
        if (player.dir === 'down') {
          ctx.arc(px + 12, py + 28, 18, 0, Math.PI);
        } else if (player.dir === 'up') {
          ctx.arc(px + 12, py - 4, 18, Math.PI, Math.PI * 2);
        } else if (player.dir === 'left') {
          ctx.arc(px - 4, py + 12, 18, Math.PI * 0.5, Math.PI * 1.5);
        } else if (player.dir === 'right') {
          ctx.arc(px + 28, py + 12, 18, Math.PI * 1.5, Math.PI * 0.5);
        }
        ctx.stroke();
      }
    }

    function drawProjectiles() {
      projectiles.forEach((p) => {
        ctx.save();
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 18;
        ctx.globalAlpha = 0.45;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x - camera.x, p.y - camera.y, p.radius * 1.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x - camera.x, p.y - camera.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    function drawShopSign() {
      const signX = (15 * TILE_SIZE) - camera.x;
      const signY = (1 * TILE_SIZE) - camera.y;
      ctx.fillStyle = '#f4d03f';
      ctx.fillRect(signX + 4, signY + 8, 80, 24);
      ctx.fillStyle = '#000';
      ctx.font = 'bold 12px Courier New';
      ctx.fillText('TIENDA', signX + 18, signY + 25);
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const startCol = Math.floor(camera.x / TILE_SIZE);
      const endCol = Math.min(MAP_COLS - 1, startCol + Math.ceil(canvas.width / TILE_SIZE) + 1);
      const startRow = Math.floor(camera.y / TILE_SIZE);
      const endRow = Math.min(MAP_ROWS - 1, startRow + Math.ceil(canvas.height / TILE_SIZE) + 1);

      for (let r = startRow; r <= endRow; r++) {
        for (let c = startCol; c <= endCol; c++) {
          drawTile(map[r][c], c * TILE_SIZE, r * TILE_SIZE);
        }
      }

      drawShopSign();
      enemies.forEach(drawEnemy);
      if (boss) drawEnemy(boss);
      drawProjectiles();
      drawPlayer();

      popups.forEach((p) => {
        const popupX = p.x - camera.x;
        const popupY = p.y - camera.y;
        ctx.fillStyle = p.color;
        ctx.font = 'bold 12px Courier New';
        ctx.fillText(p.text, popupX, popupY);
      });

      if (isNearShop()) {
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fillRect(player.x - camera.x - 20, player.y - camera.y - 38, 110, 16);
        ctx.fillStyle = '#111';
        ctx.font = 'bold 12px Courier New';
        ctx.fillText('Pulsa E para tienda', player.x - camera.x - 14, player.y - camera.y - 26);
      }
    }

    function showOverlay(title, text, buttonText) {
      overlayTitle.textContent = title;
      overlayText.textContent = text;
      startBtn.textContent = buttonText;
      overlay.classList.remove('hidden');
    }

    function resetGame() {
      player.x = 11 * TILE_SIZE;
      player.y = 5 * TILE_SIZE;
      player.hp = player.maxHp = 100;
      player.mana = player.maxMana = 100;
      player.level = 1;
      player.xp = 0;
      player.maxXp = 100;
      player.kills = 0;
      worldLevel = 1;
      zoneKills = 0;
      map = generateMap(worldLevel);
      player.gold = 0;
      player.damage = 20;
      player.magicDamage = 30;
      player.isAttacking = false;
      player.attackCooldown = 0;
      player.magicCooldown = 0;
      enemies.length = 0;
      projectiles.length = 0;
      popups.length = 0;
      boss = null;
      camera.x = 0;
      camera.y = 0;
      for (let i = 0; i < 5; i++) spawnEnemy();
      gameStarted = true;
      gameEnded = false;
      overlay.classList.add('hidden');
      closeShop();
      updateHud();
    }

    let gameStarted = false;
    let gameEnded = false;

    startBtn.addEventListener('click', resetGame);
    document.getElementById('buy-potion').addEventListener('click', () => buyItem('potion'));
    document.getElementById('buy-mana').addEventListener('click', () => buyItem('mana'));
    document.getElementById('buy-sword').addEventListener('click', () => buyItem('sword'));
    document.getElementById('buy-armor').addEventListener('click', () => buyItem('armor'));
    document.getElementById('close-shop').addEventListener('click', closeShop);

    showOverlay('Bosque del Pueblo', 'Mata enemigos, mejora tu equipo y derrota al jefe del bosque.', 'Empezar');
    for (let i = 0; i < 5; i++) spawnEnemy();
    updateHud();

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
